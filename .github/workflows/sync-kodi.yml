name: Sync latest stable Kodi

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      open_pr:
        description: Open or update the adaptation pull request
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: kodi-stable-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - name: Check Kodi release and update available mirrors
        id: kodi
        run: python sync_kodi_release.py
        env:
          GH_TOKEN: ${{ github.token }}
      - run: python addons_xml_generator.py --check
      - name: Export adaptation patch
        if: steps.kodi.outputs.updated == 'true'
        run: |
          git add -- addons.xml addons.xml.md5 repository.kodi.mirror.*
          git diff --cached --binary > "$RUNNER_TEMP/kodi-adaptation.patch"
      - name: Upload adaptation patch
        if: steps.kodi.outputs.updated == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kodi-adaptation
          path: ${{ runner.temp }}/kodi-adaptation.patch
          if-no-files-found: error
          retention-days: 14
      - name: Open or update adaptation pull request
        if: steps.kodi.outputs.updated == 'true' && (github.event_name == 'schedule' || inputs.open_pr)
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8
        with:
          branch: automation/kodi-stable-sync
          delete-branch: true
          add-paths: |
            addons.xml
            addons.xml.md5
            repository.kodi.mirror.*
          commit-message: Adapt mirrors to the latest stable Kodi release
          title: Adapt mirrors to the latest stable Kodi release
          body: |
            Update the mirrors whose Kodi add-on indexes passed the live check.
            The workflow run summary records the release, API version, and per-mirror result.
